<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandigarh | The City Beautiful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("./images/Chandigarh-Logo.jpg") center/cover no-repeat fixed;
            color: #fff;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 4rem;
            text-align: center;
            letter-spacing: 6px;
            text-shadow: 0 6px 20px rgba(0,0,0,0.7);
            margin-bottom: 10px;
            animation: fadeInDown 1.2s ease forwards;
        }

        .subtitle {
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 2px;
            color: #dcdcdc;
            margin-bottom: 50px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: fadeInUp 2s ease forwards;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
        }

        nav a:hover {
            transform: translateY(-10px) scale(1.08) rotateX(2deg);
            box-shadow: 0 18px 45px rgba(0,0,0,0.7);
            background: rgba(26, 188, 156, 0.85);
        }

        footer {
            margin-top: 60px;
            text-align: center;
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        footer span {
            color: #1abc9c;
            font-weight: bold;
        }

        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-50px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(50px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        @media(max-width: 768px){
            h1 {
                font-size: 3rem;
            }
            .subtitle {
                font-size: 1.4rem;
            }
            nav a {
                font-size: 1rem;
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="overlay">

        <h1>CHANDIGARH</h1>
        <div class="subtitle">~ The City Beautiful ~</div>

        <nav>
            <a href="about.html">About Chandigarh</a>
            <a href="history.html">History</a>
            <a href="architecture.html">Architecture & Urban Planning</a>
            <a href="places.html">Places to Visit</a>
            <a href="edu.html">Education & Institutions</a>
            <a href="food.html">Food & Cuisine</a>
        </nav>

        <footer>
            © 2025 Chandigarh Website | Designed by <span>HARJOT SINGH</span><br>
            Contact: <span>9872823745</span> 
        </footer>

    </div>
</body>
</html>
